# ==============================================================================
# mako-suite: Mako Notification Configuration
# Append or merge these rules into your ~/.config/mako/config
# Theme: Catppuccin Mocha
# ==============================================================================

# Global defaults recommended for mako-suite HUDs
font=monospace 10
background-color=#1e1e2edd
text-color=#cdd6f4
border-size=2
border-radius=8
icons=1
max-icon-size=48
default-timeout=6000
group-by=summary

# --- 1. makotop: Live CPU / RAM Telemetry HUD ---
[app-name=makotop]
border-color=#a6e3a1
default-timeout=0
width=380
height=140

# --- 2. makofetch: Fast System Specs Card ---
[app-name=makofetch]
border-color=#89b4fa
default-timeout=8000
width=400
height=220

# --- 3. makodf: Disk Usage & Filesystem HUD ---
[app-name=makodf]
border-color=#fab387
default-timeout=8000
width=500
height=240

# --- 4. makokill: Process Sniper & Panic HUD ---
[app-name=makokill]
border-color=#f38ba8
default-timeout=8000
width=440
height=220

# --- 5. makonet: Network Telemetry & Wi-Fi HUD ---
[app-name=makonet]
border-color=#cba6f7
default-timeout=0
width=440
height=220

# --- 6. makobatt: Battery Telemetry & Power Manager ---
[app-name=makobatt]
border-color=#f9e2af
default-timeout=0
width=440
height=200
